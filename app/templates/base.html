<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Business intelligence and AI platform for El-Sharnouby Group">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317324D'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
    <title>{{ page_title }} | El-Sharnouby Group</title>

    <!-- Google Fonts: Inter (UI) + IBM Plex Sans Arabic (Arabic data fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>

    <!-- Design System CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <!-- Mobile Menu Button -->
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="mobile-overlay" id="mobileOverlay"></div>

        <!-- Sidebar -->
        {% include "components/sidebar.html" %}

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <div class="page-header">
                <h1>{{ page_title }}</h1>
                {% block subtitle %}{% endblock %}
            </div>

            {% block content %}
            <div class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
                </div>
                <div class="empty-text">This page is under construction</div>
            </div>
            {% endblock %}
        </main>
    </div>

    <!-- Main JS -->
    <script src="/static/js/main.js"></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
